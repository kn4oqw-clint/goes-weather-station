# Lovelace cards for the GOES loop + NWS alerts (entities created via the HA API:
#   camera.goes19_ir_loop  (generic camera -> http://10.10.0.11:8099/loop.gif)
#   sensor.goes_wx_kmob    (from the emwin_alerts.py daemon on the LXC)

# --- Animated IR loop ---
type: picture-entity
entity: camera.goes19_ir_loop
name: GOES-19 Infrared — Gulf Coast (3h loop)
show_state: false
camera_view: auto

# --- Interactive Leaflet map (IR overlay + NWS alert polygons) ---
# Served by goes-web on the LXC. Fully offline: Leaflet is vendored locally, the
# "basemap" is Natural Earth vectors (no tile server), the IR frames are Web
# Mercator PNGs from make_loop.py, and warning polygons come off the dish in the
# EMWIN text itself. Added ALONGSIDE the camera card above, which still works.
#
# MUST be https and same-origin. HA is fronted by NPMplus at
# https://home.thechance.family (http 301s to https), so an
# http://10.10.0.11:8099 iframe is blocked as mixed content and renders blank.
# It is exposed instead as a /goesmap location on that same proxy host, which
# also satisfies the host's npmplus_x_frame_options=SAMEORIGIN.
# NOTE: that hostname resolves internally only (172.16.50.136) and does not work
# outside the house -- the map is LAN-only, same as HA itself.
type: iframe
url: https://home.thechance.family/goesmap/map.html
grid_options:
  columns: 36
  rows: 10

# --- Alert list (markdown; renders "no active alerts" when quiet) ---
type: markdown
content: >
  {% set alerts = state_attr('sensor.goes_wx_kmob','alerts') %}
  {% if alerts %}
  {% for a in alerts %}
  - **{{ a.event }}** — until {{ a.expires }}{% if a.etn %} _(#{{ a.etn }})_{% endif %}
  {% endfor %}
  {% else %}
  ✅ No active NWS alerts for the Mobile (KMOB) area.
  {% endif %}

  _Source: GOES-19 EMWIN · updated {{ state_attr('sensor.goes_wx_kmob','updated') }}_

